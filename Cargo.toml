[workspace]
members = [
    "apps/hardware-probe",
    "apps/rustdaw",
    "crates/daw-analysis",
    "crates/daw-audio-linux",
    "crates/daw-core",
    "crates/daw-engine",
    "crates/daw-midi",
    "crates/daw-project",
    "crates/daw-render",
    "crates/daw-songimport",
]
resolver = "3"

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
anyhow = "1.0.104"
crossbeam-queue = "0.3.12"
cpal = { version = "0.18.1", features = ["pulseaudio"] }
eframe = "0.33.3"
hound = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
rfd = "0.17.2"
ureq = { version = "3.4.0", default-features = false, features = ["json"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
